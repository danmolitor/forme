[package]
name = "forme-pdf-html"
# Not on the shared release line until it ships — like server/ and rasterizer/
# it versions independently for now.
version = "0.20.0"
edition = "2021"
description = "HTML + print-CSS input path for the forme-pdf engine. Satori for paginated documents."
license = "MIT"
repository = "https://github.com/formepdf/forme"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cssparser = "0.37.0"
forme-pdf = { version = "0.20.0", path = "../engine" }
html5ever = "0.39.0"
markup5ever_rcdom = "0.39.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

wasm-bindgen = { version = "0.2", optional = true }
# getrandom's js feature gives the engine's transitive getrandom (via its
# crypto deps) a wasm32 backend through feature unification.
getrandom = { version = "0.2", features = ["js"], optional = true }

[features]
wasm = ["wasm-bindgen", "getrandom", "forme-pdf/wasm"]

[[bin]]
name = "forme-html"
path = "src/main.rs"

[dev-dependencies]
# Heap profiler for the allocation-churn investigation (Fix 3). Attributes
# every allocation to a call-site backtrace so we can rank sites by count and
# bytes. Run via `cargo run --release --example dhatprofile`.
dhat = "0.3"

# dhat backtraces need line info; without it every site collapses to the same
# frame. `debug = 1` (line tables) keeps release optimizations but restores
# attribution. Applies only to builds rooted in this crate (examples/bin),
# not to the published library.
[profile.release]
debug = 1
