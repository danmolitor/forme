# Pin the toolchain so local and CI argue with the SAME compiler — a
# floating `stable` in CI plus a lagging local rustc is how a clippy lint
# that doesn't exist locally turns the board red on release day
# (question_mark, 1.95 vs 1.98, 2026-08-28). Bump deliberately, run
# clippy across engine/ and html/ with the new pin, then commit.
[toolchain]
channel = "1.98.0"
targets = ["wasm32-unknown-unknown", "wasm32-wasip1"]
components = ["rustfmt", "clippy"]
