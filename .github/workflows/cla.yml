# CLA signature gate.
#
# SECURITY: this workflow uses pull_request_target, which runs with write
# permissions on THIS repository even for PRs from forks. That is safe here
# only because the workflow never checks out, builds, installs, or executes
# any code from the PR — it does nothing but run the CLA assistant against
# GitHub's APIs. Do not add steps to this workflow. New automation belongs
# in ci.yml (which uses the unprivileged pull_request trigger).
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with write access to the signatures repo (see remote-repo-* below).
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_PAT }}
        with:
          path-to-signatures: 'signatures/v1/cla.json'
          path-to-document: 'https://github.com/formepdf/forme/blob/main/CLA.md'
          branch: 'main'
          remote-organization-name: 'danmolitor'
          remote-repository-name: 'forme-cla-signatures'
          allowlist: danmolitor,dependabot[bot],bot*
