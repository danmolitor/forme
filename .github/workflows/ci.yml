name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    name: Rust Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        working-directory: engine
        run: cargo test
      - name: Check formatting
        working-directory: engine
        run: cargo fmt --check
      - name: Clippy
        working-directory: engine
        run: cargo clippy -- -D warnings
      - name: PDF size regression check
        run: bash .github/scripts/check-pdf-size.sh

  packages:
    name: TypeScript Packages
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Install dependencies
        run: npm install
      - name: Build Shared package
        working-directory: packages/shared
        run: npm run build
      - name: Build React package
        working-directory: packages/react
        run: npm run build
      - name: Build Core (WASM + TS)
        # Must build before Svelte's check step: svelte-check typechecks
        # render-document.ts and preview/index.ts, both of which import
        # types from @formepdf/core.
        working-directory: packages/core
        run: npm run build
      - name: Assert Core tarball layout
        # Belt-and-braces against the 0.10.0 publish miss: pack the
        # package and verify every entry-point file is present. Catches
        # stray `.gitignore`s inside wasm-pack output dirs (which silently
        # drop their contents at publish time) and any future build
        # script that forgets to emit a required entry.
        working-directory: packages/core
        run: bash ./scripts/assert-tarball.sh
      - name: Build Renderer
        working-directory: packages/renderer
        run: npm run build
      - name: Build Svelte package
        working-directory: packages/svelte
        run: npm run build
      - name: Check Svelte package (svelte-check)
        working-directory: packages/svelte
        run: npm run check
      - name: Build Preact package
        working-directory: packages/preact
        run: npm run build
      - name: Build Templates
        working-directory: packages/templates
        run: npm run build
      - name: Build Tailwind
        # Needed by Test Svelte: svelte's tailwind fixtures import
        # `tw` from @formepdf/tailwind, and vite resolves the package
        # via its main/module/exports fields which only exist after
        # tsc emits dist/.
        working-directory: packages/tailwind
        run: npm run build
      - name: Build CLI
        working-directory: packages/cli
        run: npm run build
      - name: Test React
        working-directory: packages/react
        run: npm test
      - name: Test Svelte
        # After Build Core: the WASM smoke + renderDocument tests render
        # through @formepdf/core (devDependency).
        working-directory: packages/svelte
        run: npm test
      - name: Test Preact
        # Parity fixtures import from both @formepdf/preact (built above)
        # and @formepdf/react — both must be built before this runs.
        working-directory: packages/preact
        run: npm test
      - name: Test Templates (regression)
        # Structural-regression coverage for the templates we ship on npm.
        # Both suites live in packages/core (rendering needs the WASM engine
        # only core builds), so `Test Core` below already runs them — this
        # step re-runs just those two files, in under a second, so template
        # coverage is a line item a reviewer can see in the job list instead
        # of something they'd have to know is buried inside a generic step.
        working-directory: packages/core
        run: npx vitest run tests/templates.regression.test.ts tests/templates-demo.regression.test.ts
      - name: Render invoice layout for the regression demo
        # Produces the `current` file for the Document Regression Demo job.
        # The vitest matcher compares in memory and never writes one, so this
        # is the missing producer — the same getTemplate +
        # renderDocumentWithLayout pair the suite above asserts on, so the
        # demo can't drift from what CI already gates.
        working-directory: packages/core
        run: node scripts/render-template-layout.mjs invoice invoice-layout.json
      - name: Upload invoice layout
        # Handed to the demo job rather than regenerated there: reaching this
        # point costs a full wasm-pack build, and the demo only needs the
        # JSON that falls out of it.
        uses: actions/upload-artifact@v4
        with:
          name: invoice-layout
          path: packages/core/invoice-layout.json
      - name: Test Core
        working-directory: packages/core
        run: npm test
      - name: Test Core (workerd)
        # Runs vitest inside Cloudflare's workerd via
        # @cloudflare/vitest-pool-workers. Catches Workers-only
        # regressions like the 0.10.0 `wasm.__wbindgen_start` crash
        # that Node-based unit tests can't see because workerd has
        # different WASM-as-ESM semantics.
        working-directory: packages/core
        run: npm run test:workers
      - name: Test Renderer
        working-directory: packages/renderer
        run: npm test
      - name: Test CLI
        working-directory: packages/cli
        run: npm test
      - name: Test Hono
        working-directory: packages/hono
        run: npm test
      - name: Test Next
        working-directory: packages/next
        run: npm test
      - name: Test Resend
        working-directory: packages/resend
        run: npm test
      - name: Test MCP
        working-directory: packages/mcp
        run: npm test
      - name: Test VS Code Extension
        working-directory: packages/vscode
        run: npm test

  document-regression-demo:
    name: Document Regression Demo
    runs-on: ubuntu-latest
    needs: packages
    # Pull requests only — the action's whole output is a PR comment, and
    # there's nothing to comment on for a push to main.
    if: github.event_name == 'pull_request'
    # Scoped to this job deliberately. Posting the diff comment needs write
    # access to pull requests; nothing else in this workflow does, and
    # raising the workflow-level default would hand that token to every
    # build and test step too.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # For the committed baseline below; the `current` side arrives as an
      # artifact, so this job never rebuilds the engine.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: invoice-layout
      - name: Diff invoice against its committed baseline
        # Referenced by repo path rather than npm: @pdf-testkit/action is
        # `private: true` and runs from its committed ncc bundle, so the
        # runner needs no install step. Pinned to `main` because that repo
        # carries no tags yet — move to a version tag once one exists.
        #
        # `current` is raw LayoutInfo, not a converted snapshot. The action
        # accepts .pdf, .json snapshot, and .json LayoutInfo
        # interchangeably, so skipping the conversion drops a CLI install
        # without changing the diff — verified locally: both forms report
        # zero semantic events against this baseline.
        uses: danmolitor/pdf-testkit/packages/action@main
        with:
          baseline: packages/core/tests/__pdf_snapshots__/templates.regression.test-template-invoice.json
          current: invoice-layout.json
          fail-on: error
          comment: true
