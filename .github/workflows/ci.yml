name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    name: Rust Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        working-directory: engine
        run: cargo test
      - name: Check formatting
        working-directory: engine
        run: cargo fmt --check
      - name: Clippy
        working-directory: engine
        run: cargo clippy -- -D warnings
      - name: PDF size regression check
        run: bash .github/scripts/check-pdf-size.sh

  html-parity:
    name: HTML Input Path (tests + native/WASM parity)
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Run tests
        working-directory: html
        run: cargo test
      - name: Check formatting
        working-directory: html
        run: cargo fmt --check
      - name: Clippy
        working-directory: html
        run: cargo clippy --all-targets -- -D warnings
      - name: Build native CLI
        working-directory: html
        run: cargo build --release --bin forme-html
      - name: Build WASM package
        working-directory: packages/html
        run: ./build.sh
      - name: Native vs WASM byte-equality
        # Determinism across compilation targets is load-bearing for two
        # launch claims (same engine everywhere; reproducible output).
        # This is the tripwire form of the packaging verification's
        # one-time observation: render the fixture corpus through both
        # targets and require identical bytes.
        run: |
          set -e
          for f in letterhead report zebra-invoice dashed-borders; do
            ./html/target/release/forme-html "html/tests/fixtures/$f.html" -o "/tmp/$f-native.pdf" -q
            node packages/html/bin/forme-html.js "html/tests/fixtures/$f.html" -o "/tmp/$f-wasm.pdf" -q
            cmp "/tmp/$f-native.pdf" "/tmp/$f-wasm.pdf"
            echo "$f: byte-identical"
          done
      - name: Install dependencies
        # Needed for the worker (vitest-pool-workers) and browser (playwright)
        # checks below; the parity loop above uses only the Node target.
        run: npm install
      - name: HTML Node tests
        working-directory: packages/html
        run: npm test
      - name: Cross-target byte determinism (Node vs web target)
        # Every published target must produce bytes identical to the Node
        # target across the fixture corpus. The three targets embed the same
        # wasm (asserted by hash here); this proves the JS glue matches too.
        run: node packages/html/test/targets-determinism.mjs
      - name: HTML worker entry under workerd
        # Real Cloudflare WASM-as-ESM semantics via @cloudflare/vitest-pool-workers,
        # exactly as the core worker entry is gated. Catches the bundler-target
        # top-level-init crash the web entry is designed to avoid.
        working-directory: packages/html
        run: npm run test:workers
      - name: Real-browser render (headless Chromium)
        # Loads the web build in a real browser and renders a fixture — the
        # headline "runs in the browser" claim, verified not declared.
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          node packages/html/test/browser-verify.mjs

  coverage:
    name: Coverage (Rust)
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add llvm-tools to the pinned toolchain
        # rust-toolchain.toml pins the toolchain, and cargo-llvm-cov needs
        # the llvm-tools component on THAT toolchain — installing it on
        # stable isn't enough. Same trap as the rustfmt component.
        run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Engine coverage
        working-directory: engine
        run: |
          cargo llvm-cov --html
          {
            echo "### Engine coverage"
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: HTML crate coverage
        working-directory: html
        run: |
          cargo llvm-cov --html
          {
            echo "### HTML crate coverage"
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Reports and summaries are generated above, gates run below — so a
      # gate failure still leaves the numbers in the job summary and the
      # HTML drill-down in the artifact, which is exactly when you need them.
      - name: Upload HTML coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: |
            engine/target/llvm-cov/html
            html/target/llvm-cov/html
      - name: Engine coverage gate (75% lines)
        # Local baseline 80.7% at the time the gate was set. The margin is
        # for CI: Linux runners skip the macOS-system-font tests, which
        # costs a few points. Ratchet upward as coverage grows — never set
        # the gate above what CI actually reports.
        working-directory: engine
        run: cargo llvm-cov report --fail-under-lines 75
      - name: HTML crate coverage gate (80% lines)
        # Local baseline 84.9% at the time the gate was set.
        working-directory: html
        run: cargo llvm-cov report --fail-under-lines 80

  packages:
    name: TypeScript Packages
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Install dependencies
        run: npm install
      - name: Build Shared package
        working-directory: packages/shared
        run: npm run build
      - name: Build React package
        working-directory: packages/react
        run: npm run build
      - name: Build Core (WASM + TS)
        # Must build before Svelte's check step: svelte-check typechecks
        # render-document.ts and preview/index.ts, both of which import
        # types from @formepdf/core.
        working-directory: packages/core
        run: npm run build
      - name: Assert Core tarball layout
        # Belt-and-braces against the 0.10.0 publish miss: pack the
        # package and verify every entry-point file is present. Catches
        # stray `.gitignore`s inside wasm-pack output dirs (which silently
        # drop their contents at publish time) and any future build
        # script that forgets to emit a required entry.
        working-directory: packages/core
        run: bash ./scripts/assert-tarball.sh
      - name: Build Renderer
        working-directory: packages/renderer
        run: npm run build
      - name: Build Svelte package
        working-directory: packages/svelte
        run: npm run build
      - name: Check Svelte package (svelte-check)
        working-directory: packages/svelte
        run: npm run check
      - name: Build Preact package
        working-directory: packages/preact
        run: npm run build
      - name: Build Templates
        working-directory: packages/templates
        run: npm run build
      - name: Build Tailwind
        # Needed by Test Svelte: svelte's tailwind fixtures import
        # `tw` from @formepdf/tailwind, and vite resolves the package
        # via its main/module/exports fields which only exist after
        # tsc emits dist/.
        working-directory: packages/tailwind
        run: npm run build
      - name: Build CLI
        working-directory: packages/cli
        run: npm run build
      - name: Render invoice layout for the regression demo
        # Produces the `current` file for the Document Regression Demo job.
        # The vitest matcher compares in memory and never writes one, so this
        # is the missing producer — the same getTemplate +
        # renderDocumentWithLayout pair the template suite asserts on (and a
        # test in that suite byte-compares the two, so they can't drift).
        #
        # Deliberately above every test step. It needs the build and nothing
        # else, and putting it after `Test Templates` meant a regression in a
        # template skipped this step, skipped the upload, and left the demo
        # job with nothing to diff — silencing the comment in exactly the
        # case it exists to describe.
        working-directory: packages/core
        run: node scripts/render-template-layout.mjs invoice invoice-layout.json
      - name: Upload invoice layout
        # Handed to the demo job rather than regenerated there: reaching this
        # point costs a full wasm-pack build, and the demo only needs the
        # JSON that falls out of it.
        uses: actions/upload-artifact@v4
        with:
          name: invoice-layout
          path: packages/core/invoice-layout.json
      - name: Test React
        working-directory: packages/react
        run: npm test
      - name: Test Svelte
        # After Build Core: the WASM smoke + renderDocument tests render
        # through @formepdf/core (devDependency).
        working-directory: packages/svelte
        run: npm test
      - name: Test Preact
        # Parity fixtures import from both @formepdf/preact (built above)
        # and @formepdf/react — both must be built before this runs.
        working-directory: packages/preact
        run: npm test
      - name: Test Templates (regression)
        # Structural-regression coverage for the templates we ship on npm.
        # Both suites live in packages/core (rendering needs the WASM engine
        # only core builds) but run under their own config, and
        # vitest.config.ts excludes them — so this is the only step that
        # runs them, and its green check means what its name says rather
        # than re-reporting what `Test Core` already covered.
        working-directory: packages/core
        run: npm run test:templates
      - name: Test Core
        working-directory: packages/core
        run: npm test
      - name: Test Core (workerd)
        # Runs vitest inside Cloudflare's workerd via
        # @cloudflare/vitest-pool-workers. Catches Workers-only
        # regressions like the 0.10.0 `wasm.__wbindgen_start` crash
        # that Node-based unit tests can't see because workerd has
        # different WASM-as-ESM semantics.
        working-directory: packages/core
        run: npm run test:workers
      - name: Test Renderer
        working-directory: packages/renderer
        run: npm test
      - name: Test CLI
        working-directory: packages/cli
        run: npm test
      - name: Test Hono
        working-directory: packages/hono
        run: npm test
      - name: Test Next
        working-directory: packages/next
        run: npm test
      - name: Test Resend
        working-directory: packages/resend
        run: npm test
      - name: Test MCP
        working-directory: packages/mcp
        run: npm test
      - name: Test VS Code Extension
        working-directory: packages/vscode
        run: npm test

  document-regression-demo:
    name: Document Regression Demo
    runs-on: ubuntu-latest
    needs: packages
    # Pull requests only — the action's whole output is a PR comment, and
    # there's nothing to comment on for a push to main.
    #
    # `!cancelled()` rather than a bare event check: `needs: packages` skips
    # this job when packages goes red, and red is precisely when a reviewer
    # wants the diff. A regression comment that only posts when there's no
    # regression is worthless. If packages failed before the upload, the
    # download below fails loudly rather than reporting a false clean.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    # Scoped to this job deliberately. Posting the diff comment needs write
    # access to pull requests; nothing else in this workflow does, and
    # raising the workflow-level default would hand that token to every
    # build and test step too.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # For the committed baseline below; the `current` side arrives as an
      # artifact, so this job never rebuilds the engine.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: invoice-layout
      - name: Diff invoice against its committed baseline
        # Referenced by repo path rather than npm: @pdf-testkit/action is
        # `private: true` and runs from its committed ncc bundle, so the
        # runner needs no install step. Pinned to a release tag so this
        # demo's output is reproducible rather than tracking that repo's
        # main branch.
        #
        # `current` is raw LayoutInfo, not a converted snapshot. The action
        # accepts .pdf, .json snapshot, and .json LayoutInfo
        # interchangeably, so skipping the conversion drops a CLI install
        # without changing the diff — verified locally: both forms report
        # zero semantic events against this baseline.
        uses: danmolitor/pdf-testkit/packages/action@v0.1.4
        with:
          baseline: packages/core/tests/__pdf_snapshots__/templates.regression.test-template-invoice.json
          current: invoice-layout.json
          fail-on: error
          comment: true

  pdfua-conformance:
    name: PDF/UA-1 Conformance (veraPDF)
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Install dependencies
        run: npm install
      # The gate renders through two front doors, so both engine builds and
      # the packages they sit behind must exist first.
      - name: Build Shared package
        working-directory: packages/shared
        run: npm run build
      - name: Build React package
        working-directory: packages/react
        run: npm run build
      - name: Build fonts-standard
        working-directory: packages/fonts-standard
        run: npm run build
      - name: Build Core (WASM + TS)
        working-directory: packages/core
        run: npm run build
      - name: Build Templates
        working-directory: packages/templates
        run: npm run build
      - name: Build HTML WASM package
        working-directory: packages/html
        run: ./build.sh
      - name: Install veraPDF
        run: bash .github/scripts/install-verapdf.sh
      - name: Validate the PDF/UA-1 corpus
        # REQUIRE_VERAPDF turns a missing binary into a hard failure — the
        # gate must validate, never silently skip. VERAPDF points the script
        # at the headless install from the previous step.
        env:
          VERAPDF: /opt/verapdf/verapdf
          REQUIRE_VERAPDF: '1'
        run: node scripts/verify-pdfua.mjs
